<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aldur Almanthour — Coming Soon</title>
<meta name="description" content="Aldur Almanthour | Advanced for Business Solutions. Our website is coming soon.">
<link rel="icon" type="image/svg+xml" href="assets/logos/aldur-app-icon-teal.svg">

<style>
  @font-face {
    font-family: "Montserrat";
    src: url("assets/fonts/Montserrat-400.woff2") format("woff2");
    font-weight: 400;
    font-display: swap;
  }
  @font-face {
    font-family: "Montserrat";
    src: url("assets/fonts/Montserrat-500.woff2") format("woff2");
    font-weight: 500;
    font-display: swap;
  }
  @font-face {
    font-family: "Montserrat";
    src: url("assets/fonts/Montserrat-600.woff2") format("woff2");
    font-weight: 600;
    font-display: swap;
  }

  :root {
    --teal: #0B5F6B;
    --gold: #D4AF7C;
    --cream: #F2E9D9;
    --background: #F6F2EB;
    --charcoal: #333231;
    --ink-subtle: #5F5D5C;
    --line: #DDD5C8;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  body {
    background: var(--background);
    color: var(--charcoal);
    font-family: "Montserrat", system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* ---- wave, bottom-right, bleeding off the edges ---- */
  .wave {
    position: fixed;
    right: 0;
    bottom: 0;
    width: clamp(220px, 28vw, 440px);
    height: auto;
    pointer-events: none;
    user-select: none;
    z-index: 0;
    opacity: 0;
    transform: translate(10%, 10%);
    animation: wave-in 1.1s cubic-bezier(.22,.61,.36,1) 0.1s forwards;
  }

  /* ---- content column ---- */
  .stage {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 32px 24px;
    max-width: 560px;
  }

  .logo {
    width: clamp(220px, 34vw, 320px);
    height: auto;
    opacity: 0;
    transform: translateY(14px);
    animation: rise-in 0.8s cubic-bezier(.22,.61,.36,1) 0.35s forwards;
  }

  .tagline {
    margin: 18px 0 0;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-subtle);
    opacity: 0;
    transform: translateY(10px);
    animation: rise-in 0.7s cubic-bezier(.22,.61,.36,1) 0.6s forwards;
  }

  .rule {
    width: 0;
    height: 2px;
    background: var(--gold);
    margin: 28px 0;
    animation: draw-in 0.9s cubic-bezier(.22,.61,.36,1) 0.85s forwards;
  }

  h1 {
    margin: 0;
    font-size: clamp(34px, 6vw, 56px);
    font-weight: 600;
    line-height: 1.1;
    color: var(--teal);
    opacity: 0;
    transform: translateY(14px);
    animation: rise-in 0.8s cubic-bezier(.22,.61,.36,1) 1.05s forwards;
  }

  p.note {
    margin: 16px 0 0;
    font-size: 15px;
    line-height: 1.6;
    font-weight: 400;
    color: var(--charcoal);
    opacity: 0;
    transform: translateY(10px);
    animation: rise-in 0.7s cubic-bezier(.22,.61,.36,1) 1.3s forwards;
  }

  a.contact {
    margin-top: 28px;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.04em;
    color: var(--teal);
    text-decoration: none;
    border-bottom: 1px solid var(--line);
    padding-bottom: 4px;
    opacity: 0;
    transform: translateY(10px);
    animation: rise-in 0.7s cubic-bezier(.22,.61,.36,1) 1.5s forwards;
    transition: color 0.2s ease, border-color 0.2s ease;
  }

  a.contact:hover {
    color: #094E58;
    border-color: var(--gold);
  }

  @keyframes wave-in {
    to { opacity: 1; transform: translate(0, 0); }
  }

  @keyframes rise-in {
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes draw-in {
    to { width: 56px; }
  }

  @media (max-width: 480px) {
    .wave { width: clamp(160px, 46vw, 260px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .wave, .logo, .tagline, .rule, h1, p.note, a.contact {
      animation: none !important;
      opacity: 1 !important;
      transform: none !important;
      width: auto !important;
    }
    .rule { width: 56px !important; }
  }
</style>
</head>
<body>

  <img class="wave" src="assets/logos/aldur-wave-letterhead.svg" alt="" aria-hidden="true">

  <main class="stage">
    <img class="logo" src="assets/logos/aldur-wordmark-english-fullcolor.svg" alt="Aldur Almanthour">
    <p class="tagline">Advanced for Business Solutions</p>
    <div class="rule"></div>
    <h1>Coming Soon</h1>
    <p class="note">Our website is currently being prepared. For enquiries in the meantime, please reach us directly.</p>
    <a class="contact" href="mailto:info@aldurmc.com">info@aldurmc.com</a>
  </main>

</body>
</html>
